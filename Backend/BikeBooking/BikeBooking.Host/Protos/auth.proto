syntax = "proto3";

option csharp_namespace = "BikeBooking.Host.Protos";

service AuthService {
  rpc Register (RegisterRequest) returns (RegisterResponse);
}

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
}

message RegisterResponse {
  int32 userId = 1;
  string message = 2;
}