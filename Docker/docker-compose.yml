services:
  backend:
    image: bikes-booking_backend
    build:
      context:  ../Backend/BikeBooking
      dockerfile: Dockerfile
    ports:
      - "9080:80"
      - "50051:50051"
    environment:
      - Storage__Root=/app/uploads
    volumes:
      - bikes-booking-uploads:/app/uploads
    depends_on:
      - postgres

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: bikes-booking # Sets the default database name
      POSTGRES_USER: postgres # Sets the default user for the database
      POSTGRES_PASSWORD: postgres # Sets the password for the default user
    ports:
      - "5432:5432"    
    volumes:
      - bikes-booking-postgres:/var/lib/postgresql/18/docker
      
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - "8081:80"  # Access pgAdmin on http://localhost:8080
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_LISTEN_PORT: 80
    volumes:
      - bikes-booking-pgadmin:/var/lib/pgadmin

  # frontend:
  #   image: bikes-booking_frontend

  #   build:
  #     context: ../Frontend/bikes-booking
  #     dockerfile: Dockerfile
  #   restart: always
  #   ports:
  #     - "80:80"


volumes:
  bikes-booking-pgadmin:
  bikes-booking-postgres:
  bikes-booking-uploads: